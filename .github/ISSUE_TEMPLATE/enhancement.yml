name: 🚀 Enhancement
description: New feature request? Docs need improvement? Let us know.
labels: ["enhancement"]

body:

- type: markdown
  attributes:
    value: |
      Consider [supporting the project](https://github.com/sponsors/alexdlaird) ❤ to have your request prioritized.

- type: checkboxes
  id: ack
  attributes:
    label: Acknowledgements
    options:
    - label: I have written a descriptive issue title
      required: true
    - label: I have searched [`amazon-orders`'s documentation](https://amazon-orders.readthedocs.io/) to see if the feature is already support
      required: true
    - label: I have searched [Issues](issues?q=is%3Aissue) to see if the feature has already been requested
      required: true
    - label: I have [enabled `debug` mode](https://amazon-orders.readthedocs.io/troubleshooting.html#enable-debug-mode) and am attaching relevant console logs and HTML files

- type: input
  id: summary
  attributes:
    label: Summary
    description: 2-3 sentences on what you'd like to see and why, written by you even if an AI tool helped with the rest.
  validations:
    required: true

- type: textarea
  id: describe-the-enhancement
  attributes:
    label: Describe the Enhancement
    description: A clear and concise description of the how and why of the feature you'd like to see, or what specifically should be added to the documentation. If possible, include possible code snippets of interfaces you'd like to see and how you might interact with them. Keep it to a few paragraphs. Requests too long to review are closed without consideration.
  validations:
    required: true

- type: textarea
  id: describe-workarounds
  attributes:
    label: Describe Alternative Solutions/Workarounds
    description: A clear and concise description of any alternative solutions or features you've considered. If applicable, please provide snippets of any current workarounds you use.
