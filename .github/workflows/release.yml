name: Release

run-name: Release

on:
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: 'Run integration tests'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prereq:
    uses: alexdlaird/.github/.github/workflows/release-prereq.yml@main
    with:
      version_file: 'amazonorders/__init__.py'
      version_pattern: 's/^__version__ = ".*"/__version__ = "${VERSION}"/'
      repo_slug: alexdlaird/amazon-orders
      changelog: true
    secrets:
      bot_app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
      bot_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  integration:
    needs: prereq
    if: ${{ inputs.run_integration_tests }}
    uses: ./.github/workflows/integration.yml
    with:
      use_waf_solver: true
    secrets: inherit

  release:
    needs: [prereq, integration]
    if: ${{ always() && needs.prereq.result == 'success' && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    runs-on: ubuntu-latest

    env:
      FORCE_COLOR: 1
      PYTHONUNBUFFERED: 1

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install jpeg
        run: sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.prereq.outputs.version }}
          SHA: ${{ needs.prereq.outputs.squash_commit_sha }}
          RELEASE_NOTES: ${{ needs.prereq.outputs.release_notes }}
        run: |
          gh release create "$VERSION" \
            --target "$SHA" \
            --title "$VERSION" \
            --notes "$RELEASE_NOTES"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: make upload

  cleanup:
    needs: [prereq, release]
    if: always() && needs.prereq.result == 'success'
    uses: alexdlaird/.github/.github/workflows/release-cleanup.yml@main
    with:
      skip_ci: ${{ needs.release.result == 'success' }}
    secrets:
      bot_app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
      bot_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  bump:
    needs: [release, cleanup]
    if: always() && needs.release.result == 'success'
    uses: ./.github/workflows/bump-version.yml
    with:
      bump_type: next
    secrets: inherit
