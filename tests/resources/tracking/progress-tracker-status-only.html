<!DOCTYPE html>
<!-- Real page structure of Amazon's package tracking page (/progress-tracker/package), trimmed to its
     main container; personal and identifying values replaced with fake ones. -->
<html><body>
<div class="a-row a-spacing-small max-container-x" id="mainContent-container">
 <div class="a-row a-spacing-small visible" id="split-container">
  <div class="a-column a-span5" id="leftColumn-container">
  </div>
 </div>
 <section class="pt-card status-card">
  <div class="pt-status-header">
   <div class="pt-status-statuses">
    <h1 class="pt-status-main-status">
     Ordered
    </h1>
   </div>
  </div>
  <div class="pt-status-milestones">
   <div class="pt-status-milestone">
    <div class="pt-status-milestone-marker">
     <div class="pt-status-milestone-marker-check">
     </div>
    </div>
    <div class="pt-status-milestone-label">
     Ordered
    </div>
   </div>
   <div class="pt-status-milestone">
    <div class="pt-status-milestone-bar">
     <div class="pt-status-milestone-bar-progress">
     </div>
    </div>
    <div class="pt-status-milestone-marker">
     <div class="pt-status-milestone-marker-check">
     </div>
    </div>
    <div class="pt-status-milestone-label">
     Shipped
    </div>
   </div>
   <div class="pt-status-milestone">
    <div class="pt-status-milestone-bar">
     <div class="pt-status-milestone-bar-progress">
     </div>
    </div>
    <div class="pt-status-milestone-marker">
     <div class="pt-status-milestone-marker-check">
     </div>
    </div>
    <div class="pt-status-milestone-label">
     Out for delivery
    </div>
   </div>
   <div class="pt-status-milestone">
    <div class="pt-status-milestone-bar">
     <div class="pt-status-milestone-bar-progress">
     </div>
    </div>
    <div class="pt-status-milestone-marker">
     <div class="pt-status-milestone-marker-check">
     </div>
    </div>
    <div class="pt-status-milestone-label">
     Delivered
    </div>
   </div>
  </div>
 </section>
</div>
</body></html>
